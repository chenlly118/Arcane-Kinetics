name: Sync project branding
on:
  push:
    branches: [codex/check-modrinth]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 83aa5b00f903f23ad4c5d64a766777e67c8c22f7
      - name: Apply approved name, description and original basin icon
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 scripts/prepare_modrinth.py --project create-spellbook --sync
