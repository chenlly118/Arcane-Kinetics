name: Publish approved candidate
on:
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: Approved release tag (created at the CI commit)
        required: true
        default: v0.3.0
      run_id:
        description: Successful main push run of Build candidate
        required: true
      sha256:
        description: Reviewed main JAR SHA-256 from that run
        required: true
      confirmation:
        description: Type publish-v0.3.0 (matching the tag)
        required: true
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.tag || github.event.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'codex/publish/'))
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RUN_ID: ${{ inputs.run_id }}
      APPROVED_SHA256: ${{ inputs.sha256 }}
      CONFIRMATION: ${{ inputs.confirmation }}
      REQUEST_EVENT: ${{ github.event_name }}
      REQUEST_REF: ${{ github.event.ref }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT_ID || 'create-spellbook' }}
    steps:
      - name: Validate approved request and CI run
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REQUEST_EVENT" == create ]]; then
            IFS=/ read -r RELEASE_TAG RUN_ID APPROVED_SHA256 EXTRA <<< "${REQUEST_REF#codex/publish/}"
            [[ -z "$EXTRA" ]]
            CONFIRMATION="publish-$RELEASE_TAG"
            printf 'RELEASE_TAG=%s\nRUN_ID=%s\nAPPROVED_SHA256=%s\nCONFIRMATION=%s\n' "$RELEASE_TAG" "$RUN_ID" "$APPROVED_SHA256" "$CONFIRMATION" >> "$GITHUB_ENV"
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$APPROVED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$CONFIRMATION" == "publish-$RELEASE_TAG" ]]
          [[ "$MODRINTH_PROJECT" =~ ^[A-Za-z0-9_-]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > "$RUNNER_TEMP/candidate-run.json"
          export RELEASE_TAG RUN_ID APPROVED_SHA256 CONFIRMATION
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'candidate-run.json').read_text())
          assert run['event'] == 'push' and run['head_branch'] == 'main', 'Only main push builds can be released'
          assert run['conclusion'] == 'success' and run['path'] == '.github/workflows/build.yml', 'Wrong or failed workflow'
          if os.environ['REQUEST_EVENT'] == 'create':
              assert run['head_sha'] == os.environ['GITHUB_SHA'], 'Approval branch must point at the reviewed CI commit'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('source_sha=' + run['head_sha'] + '\n')
          PY
          [[ "$(gh api "repos/$GH_REPO" --jq .visibility)" == public ]]
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; inspect both platforms before recovering a partial publication.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify trusted CI source and download its exact artifact
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > "$RUNNER_TEMP/candidate-run.json"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'candidate-run.json').read_text())
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert run['head_sha'] == commit, 'CI commit does not match approved source'
          assert run['event'] == 'push' and run['head_branch'] == 'main', 'Only main push builds can be released'
          assert run['conclusion'] == 'success' and run['path'] == '.github/workflows/build.yml', 'Wrong or failed workflow'
          PY
          gh run download "$RUN_ID" --name release-candidate --dir build/release-candidate
      - name: Verify approvals and reviewed SHA-256
        id: candidate
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MODRINTH_TOKEN" || { echo 'Missing MODRINTH_TOKEN secret'; exit 1; }
          VERSION="${RELEASE_TAG#v}"
          JAR="build/release-candidate/$VERSION/create-spellbook-1.21.1-neoforge-$VERSION.jar"
          python scripts/release_check.py --jar "$JAR" --publish
          printf '%s  %s\n' "$APPROVED_SHA256" "$JAR" | sha256sum --check --strict
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ['RELEASE_TAG'][1:]
          report = json.loads((Path('build/release-candidate') / version / 'validation.json').read_text())
          assert report['passed'] and report['build_method'] == 'gradle'
          assert report['production_sha256'] == os.environ['APPROVED_SHA256']
          project = json.loads(Path('release/project.json').read_text())
          assert os.environ['MODRINTH_PROJECT'] in {project['modrinth_slug'], project.get('modrinth_project_id')}, 'Wrong Modrinth project'
          PY
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
      - name: Resolve project Slug and apply approved Modrinth metadata
        id: project
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python scripts/prepare_modrinth.py --project "$MODRINTH_PROJECT" --sync
      - name: Publish the same JAR to GitHub and Modrinth
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.RELEASE_TAG }}
          github-commitish: ${{ steps.request.outputs.source_sha }}
          github-draft: false
          github-prerelease: true
          github-files: |
            ${{ steps.candidate.outputs.jar }}
            build/release-candidate/${{ steps.candidate.outputs.version }}/SHA256SUMS.txt
          modrinth-id: ${{ steps.project.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.candidate.outputs.jar }}
          name: Arcane Kinetics ${{ steps.candidate.outputs.version }} Beta
          version: ${{ steps.candidate.outputs.version }}
          version-type: beta
          changelog-file: release/notes/${{ steps.candidate.outputs.version }}.md
          loaders: neoforge
          game-versions: 1.21.1
          game-version-filter: releases
          java: '21'
          environment: client | server
          modrinth-dependencies: |
            LNytGWDc@mc1.21.1-6.0.9(required)
            s4OWxYQQ@1.21.1-3.16.3(required)
            vvuO3ImH@9.5.1+1.21.1(required)
            8BmcQJ2H@4.9.3(required)
            9nfaJPtX@1.21.1-2.2.0(required)
            gedNE4y2@2.0.4+1.21.1-forge(required)
            u6dRKJwZ@19.64.0.455(optional)
          fail-mode: fail
      - name: Verify uploaded GitHub and Modrinth file hashes
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          RELEASE_JAR: ${{ steps.candidate.outputs.jar }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/github-release-check"
          gh release download "$RELEASE_TAG" --pattern "$(basename "$RELEASE_JAR")" --dir "$RUNNER_TEMP/github-release-check"
          cmp "$RELEASE_JAR" "$RUNNER_TEMP/github-release-check/$(basename "$RELEASE_JAR")"
          python scripts/verify_modrinth.py --project "$MODRINTH_PROJECT" --version "$RELEASE_VERSION" --file "$RELEASE_JAR" --pin-dependencies
      - name: Submit the new Modrinth project for public review
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python scripts/prepare_modrinth.py --project "$MODRINTH_PROJECT" --submit
